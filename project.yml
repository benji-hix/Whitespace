name: Whitespace

options:
  bundleIdPrefix: com.benji
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

targets:
  Whitespace:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Whitespace
    info:
      path: Sources/Whitespace/App/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Whitespace
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - public.utf8-plain-text
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
              public.mime-type:
                - text/markdown
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.benji.Whitespace
        MARKETING_VERSION: "1.0"   # first real release, declared 2026-07-26
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ALWAYS_SEARCH_USER_PATHS: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  WhitespaceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/WhitespaceTests
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.benji.WhitespaceTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Whitespace

schemes:
  Whitespace:
    build:
      targets:
        Whitespace: all
        WhitespaceTests: [test]
    test:
      targets:
        - WhitespaceTests
